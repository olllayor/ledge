name: Release

# Tag-driven releases: push a `vX.Y.Z` tag (normally via `pnpm release`)
# and this workflow builds, packages, and publishes the GitHub Release.
# `workflow_dispatch` is the manual escape hatch — it releases the version
# currently in package.json, creating the tag if it doesn't exist yet.
#
# Public releases require Developer ID signing + Apple notarization.
# Unsigned (ad-hoc) builds are blocked unless the dispatch input
# `allow_unsigned` is explicitly set to true.
#
# See docs/RELEASING.md for the full flow.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag to release (e.g. v0.2.0). Defaults to v<package.json version>.'
        required: false
        default: ''
      allow_unsigned:
        description: 'Ship an ad-hoc unsigned DMG (only for local/testing; public releases keep this false).'
        required: false
        type: boolean
        default: false

# Coalesce concurrent runs so two tag pushes within seconds don't both try
# to publish a release.
concurrency:
  group: ledge-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-14
    # Release builds compile Electron + native helper + sign + notarize +
    # DMG; allow up to an hour so a slow Apple notarization doesn’t kill
    # the job.
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      GITHUB_TOKEN: ${{ github.token }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.11.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve release tag
        id: release-tag
        env:
          # Pass the dispatch input through the environment instead of
          # splicing it into the shell via ${{ }} — templating it inline is
          # the GitHub Actions script-injection anti-pattern (a crafted
          # tag_name would run arbitrary shell in this contents:write job).
          TAG_NAME_INPUT: ${{ github.event.inputs.tag_name }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
          elif [ -n "${TAG_NAME_INPUT}" ]; then
            tag="${TAG_NAME_INPUT}"
          else
            tag="v${version}"
          fi

          # The tag must match package.json — a mismatch means the tag was
          # pushed without the release commit (or onto the wrong ref) and
          # would publish an artifact whose embedded version lies.
          if [ "${tag}" != "v${version}" ]; then
            echo "::error::Tag ${tag} does not match package.json version ${version}." \
                 "Run 'pnpm release' so the version bump and tag stay in lockstep."
            exit 1
          fi

          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            tag_exists=true
          else
            tag_exists=false
          fi

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "tag_exists=${tag_exists}" >> "$GITHUB_OUTPUT"

      - name: Create release tag (manual dispatch only)
        if: github.ref_type != 'tag' && steps.release-tag.outputs.tag_exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.release-tag.outputs.tag }}" "${GITHUB_SHA}"
          git push origin "refs/tags/${{ steps.release-tag.outputs.tag }}"

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Signing & notarization policy
        id: signing-policy
        # Public releases (tag pushes and default dispatch) require both
        # Developer ID signing and Apple notarization. The only escape
        # hatch is the dispatch input `allow_unsigned=true`, which is
        # never available on a tag push.
        #
        # Secrets are read from the step environment (not ${{ }} spliced
        # into the script body) and are never echoed — only their
        # presence is logged. Empty secrets are left unset in GITHUB_ENV:
        # electron-builder treats a *defined-but-empty* CSC_LINK as a real
        # cert path and fails trying to resolve it — worse than leaving it
        # unset, which correctly falls back to ad-hoc signing.
        env:
          CSC_LINK_SECRET: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD_SECRET: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID_SECRET: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD_SECRET: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID_SECRET: ${{ secrets.APPLE_TEAM_ID }}
          ALLOW_UNSIGNED_INPUT: ${{ github.event.inputs.allow_unsigned }}
        run: |
          set -euo pipefail

          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ "${ALLOW_UNSIGNED_INPUT}" = "true" ]; then
            allow_unsigned=true
          else
            allow_unsigned=false
          fi

          # Partial CSC config is always a hard error — half-configured
          # signing is a misconfiguration, not an unsigned-mode choice.
          if [ -n "${CSC_LINK_SECRET}" ] && [ -z "${CSC_KEY_PASSWORD_SECRET}" ]; then
            echo "::error::CSC_LINK is set but CSC_KEY_PASSWORD is empty. Set both, or unset both for allow_unsigned mode."
            exit 1
          fi
          if [ -z "${CSC_LINK_SECRET}" ] && [ -n "${CSC_KEY_PASSWORD_SECRET}" ]; then
            echo "::error::CSC_KEY_PASSWORD is set but CSC_LINK is empty. Set both, or unset both for allow_unsigned mode."
            exit 1
          fi

          apple_present=0
          if [ -n "${APPLE_ID_SECRET}" ]; then
            apple_present=$((apple_present + 1))
          fi
          if [ -n "${APPLE_APP_SPECIFIC_PASSWORD_SECRET}" ]; then
            apple_present=$((apple_present + 1))
          fi
          if [ -n "${APPLE_TEAM_ID_SECRET}" ]; then
            apple_present=$((apple_present + 1))
          fi
          if [ "${apple_present}" -ne 0 ] && [ "${apple_present}" -ne 3 ]; then
            echo "::error::Partial APPLE_* notarization secrets (need APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, and APPLE_TEAM_ID together)."
            exit 1
          fi

          has_csc=false
          if [ -n "${CSC_LINK_SECRET}" ] && [ -n "${CSC_KEY_PASSWORD_SECRET}" ]; then
            has_csc=true
          fi

          has_notary=false
          if [ "${apple_present}" -eq 3 ]; then
            has_notary=true
          fi

          if [ "${allow_unsigned}" != "true" ]; then
            if [ "${has_csc}" != "true" ]; then
              echo "::error::Code signing is required for public releases but CSC_LINK/CSC_KEY_PASSWORD are not configured." \
                   "Set the repository secrets, or re-run via workflow_dispatch with allow_unsigned=true for a non-public unsigned build."
              exit 1
            fi
            if [ "${has_notary}" != "true" ]; then
              echo "::error::Notarization is required for public releases but APPLE_ID/APPLE_APP_SPECIFIC_PASSWORD/APPLE_TEAM_ID are not configured." \
                   "Set the repository secrets, or re-run via workflow_dispatch with allow_unsigned=true for a non-public unsigned build."
              exit 1
            fi
          fi

          # Multiline-safe GITHUB_ENV writes (base64 CSC_LINK may wrap).
          write_env() {
            name="$1"
            value="$2"
            {
              printf '%s\n' "${name}<<LEDGE_ENV_EOF"
              printf '%s\n' "${value}"
              printf '%s\n' "LEDGE_ENV_EOF"
            } >> "$GITHUB_ENV"
          }

          if [ "${has_csc}" = "true" ]; then
            write_env CSC_LINK "${CSC_LINK_SECRET}"
            write_env CSC_KEY_PASSWORD "${CSC_KEY_PASSWORD_SECRET}"
            echo "Code signing credentials found — configuring."
          else
            echo "Code signing credentials not configured — ad-hoc (unsigned) packaging."
          fi

          if [ "${has_notary}" = "true" ]; then
            # Exported for the whole job so electron-builder auto-notarizes
            # and staples the .app during Build & Package (before the DMG
            # is created from that .app). The later DMG step still
            # notarizes/staples the disk image itself.
            write_env APPLE_ID "${APPLE_ID_SECRET}"
            write_env APPLE_APP_SPECIFIC_PASSWORD "${APPLE_APP_SPECIFIC_PASSWORD_SECRET}"
            write_env APPLE_TEAM_ID "${APPLE_TEAM_ID_SECRET}"
            echo "Notarization credentials found — configuring."
          else
            echo "Notarization credentials not configured — skipping .app notarization during build."
          fi

          echo "Signing policy: allow_unsigned=${allow_unsigned} has_csc=${has_csc} has_notary=${has_notary}"
          echo "allow_unsigned=${allow_unsigned}" >> "$GITHUB_OUTPUT"
          echo "has_csc=${has_csc}" >> "$GITHUB_OUTPUT"
          echo "has_notary=${has_notary}" >> "$GITHUB_OUTPUT"

      - name: Build & Package
        # With CSC_* in the job env, electron-builder signs the .app.
        # With APPLE_* in the job env, electron-builder also notarizes and
        # staples the .app after signing. scripts/build-dmg.mjs then packs
        # that (already stapled) .app into the DMG.
        run: pnpm dist:release

      - name: Notarize DMG
        # Gate on step output, not on `secrets` (unusable in `if:`).
        # APPLE_* already live in the job env from the policy step.
        if: steps.signing-policy.outputs.has_notary == 'true'
        run: |
          set -euo pipefail
          dmg="$(ls dist/*.dmg | head -1)"
          echo "Submitting ${dmg} for notarization…"
          xcrun notarytool submit "${dmg}" \
            --apple-id "${APPLE_ID}" \
            --password "${APPLE_APP_SPECIFIC_PASSWORD}" \
            --team-id "${APPLE_TEAM_ID}" \
            --wait
          xcrun stapler staple "${dmg}"

      - name: Verify release artifacts
        # Fail the job on any broken artifact — never publish a DMG whose
        # .app is unsigned when signing was required, missing the native
        # helper, or missing its notarization staple.
        env:
          HAS_CSC: ${{ steps.signing-policy.outputs.has_csc }}
          HAS_NOTARY: ${{ steps.signing-policy.outputs.has_notary }}
        run: |
          set -euo pipefail

          app_path="$(ls -d dist/mac*/Ledge.app 2>/dev/null | head -1 || true)"
          if [ -z "${app_path}" ] || [ ! -d "${app_path}" ]; then
            echo "::error::Packaged Ledge.app not found under dist/mac*."
            exit 1
          fi

          dmg="$(ls dist/*.dmg 2>/dev/null | head -1 || true)"
          if [ -z "${dmg}" ] || [ ! -f "${dmg}" ]; then
            echo "::error::Release DMG not found under dist/."
            exit 1
          fi

          echo "Verifying code signature on ${app_path}…"
          codesign --verify --deep --strict --verbose=2 "${app_path}"

          native_bin="${app_path}/Contents/Resources/native/DropShelfNativeAgent"
          if [ ! -x "${native_bin}" ]; then
            echo "::error::Native agent missing or not executable at ${native_bin}"
            exit 1
          fi
          echo "Native agent present and executable."

          if [ "${HAS_CSC}" = "true" ]; then
            echo "Confirming Developer ID Application identity…"
            codesign -dv "${app_path}" 2>&1 | tee /tmp/ledge-codesign-info.txt
            if ! grep -q "Developer ID Application" /tmp/ledge-codesign-info.txt; then
              echo "::error::Expected a Developer ID Application signature but none was found (ad-hoc or unexpected identity)."
              exit 1
            fi
          fi

          if [ "${HAS_NOTARY}" = "true" ]; then
            echo "Assessing Gatekeeper acceptance of ${app_path}…"
            spctl --assess --type execute --verbose=2 "${app_path}"
            echo "Validating notarization staple on ${app_path}…"
            xcrun stapler validate "${app_path}"
            echo "Validating notarization staple on ${dmg}…"
            xcrun stapler validate "${dmg}"
          fi

          echo "All artifact verification checks passed."

      - name: List artifacts
        run: ls -R dist/ | head -50

      - name: Extract release notes
        id: notes
        run: |
          set -euo pipefail
          node scripts/release-notes.mjs "${{ steps.release-tag.outputs.version }}" > release-notes.md
          echo "--- Release notes ---"
          cat release-notes.md

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ledge-dmg
          path: dist/*.dmg

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release-tag.outputs.tag }}
          name: Ledge ${{ steps.release-tag.outputs.tag }}
          body_path: release-notes.md
          files: |
            dist/*.dmg
