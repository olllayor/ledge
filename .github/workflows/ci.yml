name: CI

on:
  # PR coverage comes from pull_request, so push CI is only for direct main
  # commits. This keeps the same SHA from being verified twice.
  push:
    branches:
      - main
  pull_request:

# Drop superseded runs when a PR is updated or a branch is force-pushed.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: macos-14
    # Cap the job at 20 minutes so a hung build or flaky test can’t
    # block the queue. lint+test+build normally finish in ~5 minutes.
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.11.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        # lint/test/electron-vite do not need the Electron.app binary.
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
